name: Designer's Receipts Gate

on:
  pull_request:
    paths:
      - '**/*.tsx'
      - '**/*.jsx'
  push:
    branches:
      - main

jobs:
  receipt-check:
    name: Check Designer's Receipts
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run receipt gate on passing fixtures
        run: |
          node scripts/check-receipts.mjs extension/test-fixtures/PricingCard.tsx
      
      - name: Verify contrast error detection
        run: |
          echo "Testing that low-contrast fixture correctly fails..."
          if node scripts/check-receipts.mjs extension/test-fixtures/LowContrastCard.tsx; then
            echo "❌ FAIL: LowContrastCard should have failed but passed"
            exit 1
          else
            echo "✅ Contrast error correctly detected"
          fi
